name: 持仓止盈止损监控

on:
  schedule:
    - cron: '35 1 * * 1-5'
    - cron: '40 1 * * 1-5'
    - cron: '45 1 * * 1-5'
    - cron: '50 1 * * 1-5'
    - cron: '55 1 * * 1-5'
    - cron: '0 2 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install akshare pandas numpy requests
      - run: python stock_band.py monitor
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
