name: 波段选股推送

on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install akshare pandas numpy requests
      - run: python stock_band.py select
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
